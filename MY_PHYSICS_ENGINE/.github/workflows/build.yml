name: PP2 simulator
on: [push, workflow_dispatch]
jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build + all tests (g++)
        run: |
          set -o pipefail
          sh build.sh 2>&1 | tee build-host.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pp2-host-log
          path: build-host.log
  android:
    runs-on: ubuntu-latest
    needs: host
    steps:
      - uses: actions/checkout@v4
      - name: Build arm64-v8a (NDK)
        run: |
          set -o pipefail
          NDK="${ANDROID_NDK_HOME:-$ANDROID_NDK_LATEST_HOME}"
          echo "NDK=$NDK"
          {
            cmake -S . -B build-android -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
              -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-24 -DCMAKE_BUILD_TYPE=Release
            cmake --build build-android --parallel
          } 2>&1 | tee build-android.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pp2-android-log
          path: build-android.log
      - uses: actions/upload-artifact@v4
        with:
          name: pp2-sim-android-arm64
          if-no-files-found: error
          path: |
            build-android/libpp2_sim.so
            build-android/pp2_sim
            build-android/libpp2_il2cpp_host.a
            data/
