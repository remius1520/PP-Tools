name: PP v85 SAFETY TEST (separate applicationId com.premiumpath.test)
on: [push, workflow_dispatch]
jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh build.sh
  apk:
    runs-on: ubuntu-latest
    needs: host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "ndk;26.1.10909125" "cmake;3.22.1" "platforms;android-34" "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: "8.7" }
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: premiumpath-test-apk, path: app/build/outputs/apk/debug/*.apk }
